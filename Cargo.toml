[package]
name = "mouseblur"
version = "1.0.0"
edition = "2024"
authors = ["MouseBlur Contributors"]
description = "High-performance, GPU-accelerated mouse motion blur for Windows"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectComposition", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Performance", "Win32_Security", "Win32_Media", "Win32_Graphics_DirectWrite", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

